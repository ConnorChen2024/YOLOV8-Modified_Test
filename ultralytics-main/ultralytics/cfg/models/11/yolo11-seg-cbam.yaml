#
# Ultralytics YOLO11-seg instance segmentation model [MODIFIED with CBAM]
# This file adds a CBAM module to the backbone at layer 5
# All subsequent layer indices in backbone and head have been updated.
#
# Parameters
nc: 2 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n-seg.yaml' will call yolo11-seg.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] 
  s: [0.50, 0.50, 1024] 
  m: [0.50, 1.00, 512] 
  l: [1.00, 1.00, 512] 
  x: [1.00, 1.50, 512] 

# YOLO11n backbone [MODIFIED]
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4 (P3/8-small output)
  - [-1, 1, CBAM, [512]]              # 5 <-- [!!! NEW MODULE !!!]
  - [-1, 1, Conv, [512, 3, 2]] # 6-P4/16 (was 5)
  - [-1, 2, C3k2, [512, True]]        # 7 (was 6, P4/16 output)
  - [-1, 1, Conv, [1024, 3, 2]] # 8-P5/32 (was 7)
  - [-1, 2, C3k2, [1024, True]]       # 9 (was 8)
  - [-1, 1, SPPF, [1024, 5]]          # 10 (was 9)
  - [-1, 2, C2PSA, [1024]]            # 11 (was 10, P5/32 output)

# YOLO11n head [MODIFIED INDICES]
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 12 (was 11)
  - [[-1, 7], 1, Concat, [1]] # 13 (was 12) cat backbone P4 (index 7, was 6)
  - [-1, 2, C3k2, [512, False]]               # 14 (was 13)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 15 (was 14)
  - [[-1, 4], 1, Concat, [1]] # 16 (was 15) cat backbone P3 (index 4, unchanged)
  - [-1, 2, C3k2, [256, False]]               # 17 (was 16) (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]                # 18 (was 17)
  - [[-1, 14], 1, Concat, [1]] # 19 (was 18) cat head P4 (index 14, was 13)
  - [-1, 2, C3k2, [512, False]]               # 20 (was 19) (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                # 21 (was 20)
  - [[-1, 11], 1, Concat, [1]] # 22 (was 21) cat head P5 (index 11, was 10)
  - [-1, 2, C3k2, [1024, True]]               # 23 (was 22) (P5/32-large)

  - [[17, 20, 23], 1, Segment, [nc, 32, 256]] # 24 (was 23) Detect(P3, P4, P5)